
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Weather App</h1>

        <div class="search">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >
            <button onclick="getWeather()">Search</button>
        </div>

        <p id="message"></p>

        <div id="weatherResult" class="weather">
            <h2 id="cityName"></h2>
            <h1 id="temperature"></h1>
            <p id="condition"></p>
            <p id="humidity"></p>
            <p id="wind"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
